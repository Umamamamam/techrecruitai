<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Signing you in...</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
<style>
  *{ margin:0; padding:0; box-sizing:border-box; }
  body{
    font-family:'Poppins',sans-serif;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    min-height:100vh;
    background:#fff;
    color:#1f2937;
    gap:16px;
  }
  .spinner{
    width:48px; height:48px;
    border:4px solid #e5e7eb;
    border-top-color:#8b0000;
    border-radius:50%;
    animation:spin 0.8s linear infinite;
  }
  @keyframes spin{ to{ transform:rotate(360deg); } }
  p{ font-size:15px; color:#6b7280; }
</style>
</head>
<body>
  <div class="spinner" id="spinner"></div>
  <p id="msg">Completing sign-in, please wait...</p>

<script>
(async () => {

  // Check both hash and query params
  const hash         = window.location.hash.substring(1);
  const search       = window.location.search.substring(1);
  const hashParams   = new URLSearchParams(hash);
  const searchParams = new URLSearchParams(search);

  const access_token  = hashParams.get('access_token')  || searchParams.get('access_token');
  const refresh_token = hashParams.get('refresh_token') || searchParams.get('refresh_token');
  const code          = searchParams.get('code')         || hashParams.get('code');

  console.log('access_token:', access_token ? 'found' : 'not found');
  console.log('code:', code ? 'found' : 'not found');

  if (!access_token && !code) {
    document.getElementById('msg').textContent = 'Sign-in failed. Redirecting to login...';
    setTimeout(() => { window.location.href = '/login.html'; }, 2000);
    return;
  }

  try {
    const body = access_token
      ? { access_token, refresh_token }
      : { code };

    const res  = await fetch('/api/auth/oauth/session', {
      method:  'POST',
      headers: { 'Content-Type': 'application/json' },
      body:    JSON.stringify(body)
    });

    const data = await res.json();
    console.log('session response:', data);

    if (!data.success) {
      document.getElementById('msg').textContent = data.message || 'Sign-in failed. Redirecting...';
      setTimeout(() => { window.location.href = '/login.html'; }, 2000);
      return;
    }

    // Save session
    localStorage.setItem('token', data.token);
    localStorage.setItem('user', JSON.stringify(data.user));

    // Set toast to show on index.html
    localStorage.setItem('oauth_toast', `👋 Hey, ${data.user.full_name}! Login successful.`);

    document.getElementById('msg').textContent = `Welcome, ${data.user.full_name}! Redirecting...`;

    setTimeout(() => { window.location.href = '/index.html'; }, 1000);

  } catch (err) {
    console.error(err);
    document.getElementById('msg').textContent = 'Something went wrong. Redirecting to login...';
    setTimeout(() => { window.location.href = '/login.html'; }, 2000);
  }

})();
</script>
</body>
</html>
